# Perfil de pruebas: H2 en memoria (modo Oracle) en vez de Oracle real, sin
# Flyway (las migraciones usan sintaxis propia de Oracle) y sin arrancar el
# consumidor de Kafka. Permite ejecutar los tests sin infraestructura externa.
spring:
  datasource:
    url: jdbc:h2:mem:report;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

campuslab:
  kafka:
    listener:
      auto-startup: false
